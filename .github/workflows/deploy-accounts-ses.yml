# 多 Cloudflare 账户：每个 GitHub Environment 对应一个 CF 账户
# 登记列表：deploy/accounts.json（从 accounts.json.example 复制）

name: Deploy to CF accounts (SES)

on:
  push:
    branches: [main]
    paths:
      - 'mail-worker/**'
      - 'mail-vue/**'
      - 'deploy/accounts.json'
      - '.github/workflows/deploy-accounts-ses.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: '仅部署指定 GitHub Environment（留空则部署 accounts.json 全部）'
        required: false
        type: string
      domain:
        description: '覆盖 DOMAIN Secret（单域名 JSON 数组项）'
        required: false
        type: string
      admin_email:
        description: '覆盖 ADMIN Secret'
        required: false
        type: string
      worker_name:
        description: '覆盖 Worker 名称（对应 accounts.json 的 name）'
        required: false
        type: string

jobs:
  load-accounts:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        run: |
          ENV_INPUT="${{ github.event.inputs.environment }}"
          if [[ -n "$ENV_INPUT" ]]; then
            NAME="${{ github.event.inputs.worker_name }}"
            NAME="${NAME:-cloud-mail}"
            echo "matrix=[{\"environment\":\"${ENV_INPUT}\",\"name\":\"${NAME}\"}]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! -f deploy/accounts.json ]]; then
            echo '[ERR] 缺少 deploy/accounts.json，请从 deploy/accounts.json.example 复制'
            exit 1
          fi
          echo "matrix=$(jq -c . deploy/accounts.json)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: load-accounts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        account: ${{ fromJson(needs.load-accounts.outputs.matrix) }}
    environment: ${{ matrix.account.environment }}

    env:
      NAME: ${{ matrix.account.name }}
      CUSTOM_DOMAIN: ${{ secrets.CUSTOM_DOMAIN }}
      DOMAIN: ${{ secrets.DOMAIN }}
      ADMIN: ${{ secrets.ADMIN }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      SEND_PROVIDER: ${{ secrets.SEND_PROVIDER }}
      ZEPTOMAIL_TOKEN: ${{ secrets.ZEPTOMAIL_TOKEN }}
      INBOUND_WEBHOOK_SECRET: ${{ secrets.INBOUND_WEBHOOK_SECRET }}
      ZEPTOMAIL_FROM: ${{ secrets.ZEPTOMAIL_FROM }}

    steps:
      - uses: actions/checkout@v4

      - name: workflow_dispatch 覆盖 DOMAIN / ADMIN
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ -n "${{ github.event.inputs.domain }}" ]]; then
            echo "DOMAIN=[\"${{ github.event.inputs.domain }}\"]" >> "$GITHUB_ENV"
          fi
          if [[ -n "${{ github.event.inputs.admin_email }}" ]]; then
            echo "ADMIN=${{ github.event.inputs.admin_email }}" >> "$GITHUB_ENV"
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: mail-worker/pnpm-lock.yaml

      - name: Install mail-worker deps
        working-directory: mail-worker
        run: pnpm install --frozen-lockfile

      - name: Install mail-vue deps
        working-directory: mail-vue
        run: pnpm install --frozen-lockfile

      - name: Build frontend to mail-worker/dist
        working-directory: mail-vue
        run: |
          set -e
          pnpm install --frozen-lockfile
          node node_modules/vite/bin/vite.js build --mode release
          if [ ! -f ../mail-worker/dist/index.html ]; then
            if [ -f dist/index.html ]; then
              echo '[WARN] 产物在 mail-vue/dist，同步到 mail-worker/dist'
              mkdir -p ../mail-worker/dist
              cp -a dist/. ../mail-worker/dist/
            fi
          fi
          if [ ! -f ../mail-worker/dist/index.html ]; then
            echo '[ERR] mail-worker/dist 未生成，请检查 mail-vue 构建'
            ls -la ../mail-worker/dist 2>/dev/null || true
            ls -la dist 2>/dev/null || true
            exit 1
          fi
          echo '[OK] 前端静态资源: mail-worker/dist'

      - name: Prepare wrangler config
        working-directory: mail-worker
        run: |
          set -e
          if [ -z "$JWT_SECRET" ] || grep -q '[?%#/\\]' <<< "$JWT_SECRET"; then
            echo '[ERR] JWT_SECRET 无效'
            exit 1
          fi
          if ! jq -e 'type == "array"' <<< "$DOMAIN"; then
            echo '[ERR] DOMAIN 须为 JSON 数组'
            exit 1
          fi
          for v in ADMIN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!v}" ]; then echo "[ERR] 未设置 $v"; exit 1; fi
          done
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo '[OK] 使用 CLOUDFLARE_API_TOKEN 认证'
          elif [ -n "$CLOUDFLARE_API_KEY" ] && [ -n "$CLOUDFLARE_EMAIL" ]; then
            echo '[OK] 使用 CLOUDFLARE_API_KEY + CLOUDFLARE_EMAIL 认证'
          else
            echo '[ERR] 须设置 CLOUDFLARE_API_TOKEN，或同时设置 CLOUDFLARE_API_KEY 与 CLOUDFLARE_EMAIL'
            exit 1
          fi

          CONFIG=wrangler-action.toml
          cp "$CONFIG" wrangler-deploy.generated.toml

          if [ -z "$R2_BUCKET_NAME" ]; then
            sed -i '/\[\[r2_buckets\]\]/,/^$/d' wrangler-deploy.generated.toml
          fi
          if [ -z "$CUSTOM_DOMAIN" ]; then
            sed -i '/\[\[routes\]\]/,/^$/d' wrangler-deploy.generated.toml
          fi
          sed -i '/^linuxdo_/d' wrangler-deploy.generated.toml 2>/dev/null || true

          sed -i "s|\${NAME}|${NAME}|g" wrangler-deploy.generated.toml
          sed -i "s|\${CUSTOM_DOMAIN}|${CUSTOM_DOMAIN}|g" wrangler-deploy.generated.toml
          sed -i "s|\"\${DOMAIN}\"|${DOMAIN}|g" wrangler-deploy.generated.toml
          sed -i "s|\${ADMIN}|${ADMIN}|g" wrangler-deploy.generated.toml
          sed -i "s|\${JWT_SECRET}|${JWT_SECRET}|g" wrangler-deploy.generated.toml
          sed -i "s|\${R2_BUCKET_NAME}|${R2_BUCKET_NAME}|g" wrangler-deploy.generated.toml
          sed -i "s|\${AI_MODEL}|@cf/meta/llama-3.1-8b-instruct|g" wrangler-deploy.generated.toml
          sed -i "s|\${ANALYSIS_CACHE}|false|g" wrangler-deploy.generated.toml
          sed -i "s|\${PROJECT_LINK}||g" wrangler-deploy.generated.toml

          bash ../scripts/strip-wrangler-cron-triggers.sh wrangler-deploy.generated.toml

      - name: Ensure KV
        working-directory: mail-worker
        run: |
          CONFIG=wrangler-deploy.generated.toml
          if [ -n "$KV_NAMESPACE_ID" ]; then
            sed -i "s|\${KV_NAMESPACE_ID}|${KV_NAMESPACE_ID}|g" "$CONFIG"
            exit 0
          fi
          KV_ID="$(bash ../scripts/ensure-kv-id.sh "$NAME")"
          sed -i "s|\${KV_NAMESPACE_ID}|${KV_ID}|g" "$CONFIG"

      - name: Ensure D1
        working-directory: mail-worker
        run: |
          CONFIG=wrangler-deploy.generated.toml
          if [ -n "$D1_DATABASE_ID" ]; then
            sed -i "s|\${D1_DATABASE_ID}|${D1_DATABASE_ID}|g" "$CONFIG"
            exit 0
          fi
          D1_ID=$(bash ../scripts/ensure-d1-id.sh "$NAME")
          sed -i "s|\${D1_DATABASE_ID}|${D1_ID}|g" "$CONFIG"

      - name: Ensure workers.dev subdomain
        env:
          GITHUB_ENVIRONMENT_NAME: ${{ matrix.account.environment }}
        run: bash scripts/ensure-workers-dev-subdomain.sh

      - name: Deploy Worker
        id: deploy
        working-directory: mail-worker
        run: |
          set -e
          if [ ! -f dist/index.html ]; then
            echo '[ERR] 缺少 dist/index.html，请先完成前端构建'
            exit 1
          fi
          SECRETS_FILE="$(mktemp)"
          bash ../scripts/build-wrangler-secrets-file.sh "$SECRETS_FILE"
          DEPLOY_ARGS=(-c wrangler-deploy.generated.toml)
          if [ -s "$SECRETS_FILE" ]; then
            DEPLOY_ARGS+=(--secrets-file "$SECRETS_FILE")
          fi
          set -o pipefail
          pnpm wrangler deploy "${DEPLOY_ARGS[@]}" 2>&1 | tee deploy.log
          DEPLOY_RC=${PIPESTATUS[0]}
          rm -f "$SECRETS_FILE"
          WORKER_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | tail -1 || true)
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"
          if [ "$DEPLOY_RC" -ne 0 ]; then
            echo "[ERR] wrangler deploy 失败 (exit $DEPLOY_RC)"
            exit "$DEPLOY_RC"
          fi
          if [ -z "$WORKER_URL" ]; then
            echo "[ERR] 部署日志中未解析到 workers.dev URL"
            exit 1
          fi
          echo "[OK] Worker URL: $WORKER_URL"

      - name: Enable Worker on workers.dev
        working-directory: mail-worker
        run: |
          set -e
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            AUTH=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          else
            AUTH=(-H "X-Auth-Email: $CLOUDFLARE_EMAIL" -H "X-Auth-Key: $CLOUDFLARE_API_KEY")
          fi
          curl -sS "${AUTH[@]}" -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$NAME/subdomain" \
            -H 'Content-Type: application/json' \
            -d '{"enabled":true}' | jq -e '.success == true' >/dev/null \
            || echo '[WARN] 启用脚本 workers.dev 路由失败（若已部署可忽略）'

      - name: Init D1
        run: |
          set -e
          WORKER_URL="${CUSTOM_DOMAIN:+https://${CUSTOM_DOMAIN}}"
          WORKER_URL="${WORKER_URL:-${{ steps.deploy.outputs.worker_url }}}"
          if [ -z "$WORKER_URL" ]; then
            echo '[ERR] 无 Worker URL，无法初始化 D1'
            exit 1
          fi
          INIT_URL="${WORKER_URL%/}/api/init/${JWT_SECRET}"
          echo "[OK] D1 初始化: ${INIT_URL%%/*}${INIT_URL#https://*/api}"
          ok=0
          for i in $(seq 1 30); do
            set +e
            CODE=$(curl -sS -o body.txt -w '%{http_code}' --connect-timeout 20 --max-time 120 "$INIT_URL" 2>curl.err)
            CURL_RC=$?
            set -e
            if [ "$CURL_RC" -eq 0 ] && [ "$CODE" = "200" ]; then
              cat body.txt
              echo "[OK] D1 初始化完成（第 ${i} 次尝试）"
              ok=1
              break
            fi
            echo "[WARN] 第 ${i}/30 次: curl_exit=${CURL_RC} http=${CODE:-none}"
            [ -s curl.err ] && head -3 curl.err
            [ -s body.txt ] && head -5 body.txt
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo '[ERR] D1 初始化失败（Worker 可能尚未就绪或 JWT_SECRET 与 Worker 不一致）'
            exit 1
          fi
